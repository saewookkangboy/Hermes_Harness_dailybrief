# Hermes Content Studio — 네이버 데이터랩 수요 레이더 (조회 전용)
#
# 매주 월요일, 테마별 키워드의 네이버 검색 추이를 보고 급상승 키워드를
# Slack 으로 "제안"합니다. M1 리서치에 자동으로 넣지 않습니다 (/research 는 사람이 실행).

demand_radar:
  version: "1.0.0"

  # sample: tests/fixtures/datalab/search_trend_sample.json (알림·Notion 없음)
  # api:    네이버 데이터랩 통합 검색어 트렌드 API
  # env HERMES_DEMAND_RADAR_MODE 가 있으면 그 값이 우선합니다.
  mode: sample

  api:
    # hub:    NAVER API HUB (2026-07-31 이관 이후 신규 발급). 키: NAVER_HUB_API_KEY_ID / NAVER_HUB_API_KEY
    # legacy: 개발자센터 키 (2027-06-30 까지). 키: NAVER_CLIENT_ID / NAVER_CLIENT_SECRET
    provider: hub
    hub_url: https://naverapihub.apigw.ntruss.com/search-trend/v1/search
    legacy_url: https://openapi.naver.com/v1/datalab/search
    timeout_seconds: 20

  time_unit: week
  lookback_weeks: 12          # 추이 표 기간
  baseline_weeks: 4           # 급상승 비교 기준: 직전 4주 평균

  rising:
    min_growth_pct: 30        # 마지막 주 ÷ 직전 4주 평균 - 1
    min_baseline_ratio: 2.0   # 기준이 너무 작은 키워드(잡음) 제외 — ratio 는 요청 내 최대값 100 기준 상대값
    max_suggestions: 5

  # 데이터랩 제한: 요청당 그룹 5개, 그룹당 키워드 20개. 키워드마다 그룹 1개로 보내 5개씩 나눠 요청합니다.
  themes:
    "AI 에이전트·자동화": [AI 에이전트, 에이전틱 AI, 업무 자동화, n8n, 바이브 코딩]
    "AX·AI 교육": [AX 전환, AI 교육, AI 리터러시, 생성형 AI 교육, AI 전환]
    "AI 검색 최적화": [GEO 최적화, AEO, AI 검색 최적화, 생성형 검색, AI 브리핑]

  notify:
    slack_home_channel: true
    schedule: "40 8 * * 1"     # 월요일 08:40 KST

  outputs:
    dir: content/signals
