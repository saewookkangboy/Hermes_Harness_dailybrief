intents:
  how_to: [방법, 하는 법, 가이드, 구축, 만들기, 도입, how to, guide, setup, implement]
  comparison: [비교, vs, 대안, 추천, alternative, best, versus]
  strategy: [전략, 로드맵, 플랜, strategy, roadmap, playbook]
  trend: [트렌드, 동향, 전망, 뉴스, trend, news, outlook]
default_intent: trend
intent_labels:
  how_to: 실행 가이드
  comparison: 도구·대안 비교
  strategy: 전략 수립
  trend: 트렌드 파악

# ── M1b 7-Lens ────────────────────────────────────────────────
lenses:
  definition:
    label: 정의·개념
    sources: [web]
    queries: ["what is {en}", "{ko} 개념 정리", "{en} explained guide"]
    tag_terms: [what is, explained, guide, introduction, overview, definition, 개념, 정의, 입문, 가이드, 이란]
  market_news:
    label: 시장·뉴스
    sources: [news, web]
    queries: ["{en} news {year}", "{ko} 최신 뉴스", "{en} market growth {year}"]
    tag_terms: [market, funding, announce, launch, report, growth, billion, million, survey, 시장, 발표, 출시, 투자, 성장, 조사]
  tech_tools:
    label: 기술·도구
    sources: [web, github]
    queries: ["{en} tools platform {year}", "{en} open source", "{en} API automation"]
    tag_terms: [tool, platform, api, open source, github, sdk, framework, release, plugin, integration, 도구, 플랫폼, 오픈소스, 솔루션]
  use_cases:
    label: 사례·Use case
    sources: [web, news]
    queries: ["{en} case study marketing", "{ko} 도입 사례", "{en} brand campaign results"]
    tag_terms: [case study, case, campaign, results, roi, customer, deployed, adopted, success, 사례, 도입, 캠페인, 성과, 효과]
  risk_regulation:
    label: 규제·리스크
    sources: [web, news]
    queries: ["{en} risks challenges", "{en} regulation compliance {year}", "{ko} 규제 리스크"]
    tag_terms: [risk, regulation, compliance, privacy, lawsuit, ban, governance, security, ethics, fraud, 규제, 리스크, 개인정보, 보안, 윤리, 소송]
  korea:
    label: 한국 맥락
    sources: [news, web]
    queries: ["{ko} 국내 기업", "{ko} 한국 시장 {year}", "Korea {en} {year}"]
    tag_terms: [korea, korean, seoul, naver, kakao, samsung, coupang, 한국, 국내, 네이버, 카카오, 삼성, 쿠팡, 서울]
  future_signals:
    label: 미래 신호
    sources: [arxiv, hn, web]
    queries: ["{en} future trends {next_year}", "{en} research", "{en} emerging"]
    tag_terms: [future, forecast, outlook, roadmap, research, paper, emerging, next, prediction, arxiv, 전망, 미래, 연구, 예측, 차세대]

sources:
  web: {enabled: true, max_results: 4, timelimit: m, fallback_timelimit: y}
  news: {enabled: true, max_results: 4, timelimit: m, fallback_timelimit: y}
  github: {enabled: true, max_results: 5, min_stars: 20}
  arxiv: {enabled: true, max_results: 4}
  hn: {enabled: true, max_results: 4, min_points: 5}
  timeout_seconds: 12
  workers: 6

source_weights:
  news: 0.85
  web: 0.7
  github: 0.8
  arxiv: 0.9
  hn: 0.6

# ── M1d Evidence ──────────────────────────────────────────────
evidence:
  relevance_threshold: 0.5   # 핵심어 그룹 중 매칭 비율
  max_items: 40
  top_insights: 7
  freshness_days_full: 30
  freshness_days_zero: 365

# ── Gates ────────────────────────────────────────────────────
gates:
  relevance:
    min_relevant: 8
    raw_ratio_warn: 0.35
    blocking: true
  coverage:
    min_lenses: 4
    target_lenses: 5
    blocking: true
  diversity:
    min_source_types: 2
    target_source_types: 3
    min_domains: 5
    blocking: true
  blueprint:
    min_opportunities: 4
    blocking: true
  future:
    min_signals_per_prediction: 2
    blocking: true
  channel:
    naturalness: true
    blocking: true

# ── M2 AX Blueprint ──────────────────────────────────────────
value_chain:
  research:
    label: 시장·고객 리서치
    automation: "검색·소셜·리뷰 신호를 매일 수집해 요약하는 리서치 에이전트"
    kpi: 인사이트 리드타임(시간)
    hitl: "주간 우선순위 확정은 사람이 해요"
    lens_boost: [market_news, korea, future_signals]
    evidence_terms: [trend, survey, report, market, insight, consumer, 트렌드, 조사, 리포트, 시장, 소비자]
  planning:
    label: 기획·전략
    automation: "브리프 → 콘텐츠 캘린더·메시지 하우스 초안 자동 생성"
    kpi: 기획 사이클 타임(일)
    hitl: "포지셔닝·메시지 최종 승인은 사람이 해요"
    lens_boost: [definition, use_cases]
    evidence_terms: [strategy, guide, how to, playbook, framework, roadmap, 전략, 가이드, 기획, 방법, 구축]
  production:
    label: 콘텐츠 제작
    automation: "채널별 카피·이미지·숏폼 변형을 템플릿 기반으로 대량 생성"
    kpi: 에셋당 제작 시간·변형 수
    hitl: "브랜드 톤·사실 확인 검수는 사람이 해요"
    lens_boost: [tech_tools, use_cases]
    evidence_terms: [content, creative, video, copy, generate, studio, 콘텐츠, 제작, 영상, 생성, 크리에이티브]
  distribution:
    label: 배포·채널 운영
    automation: "채널별 최적 시간 예약 발행·크로스포스팅 워크플로"
    kpi: 발행 리드타임·채널 커버리지
    hitl: "위기 이슈 시 발행 중단(stop button)은 사람이 해요"
    lens_boost: [tech_tools, market_news]
    evidence_terms: [channel, publish, schedule, integration, workflow, sdk, api, 채널, 배포, 연동, 운영, 자동화]
  measurement:
    label: 측정·분석
    automation: "채널 지표 자동 수집 → 주간 성과 리포트·이상 탐지"
    kpi: 리포트 작성 시간·이상 탐지 리드타임
    hitl: "지표 해석과 다음 액션 결정은 사람이 해요"
    lens_boost: [use_cases, tech_tools]
    evidence_terms: [analytics, metric, attribution, dashboard, measure, tracking, 분석, 지표, 측정, 성과, 대시보드]
  optimization:
    label: 최적화·개인화
    automation: "A/B·세그먼트별 메시지 자동 실험과 예산 재배분 제안"
    kpi: 전환율·ROAS·CTOR 개선폭
    hitl: "예산 재배분 승인·개인정보 사용 범위 결정은 사람이 해요"
    lens_boost: [risk_regulation, use_cases]
    evidence_terms: [personalization, segment, a/b, experiment, recommendation, privacy, consent, 개인화, 세그먼트, 최적화, 추천, 실험, 동의]

domain_stage_impact:
  commerce: {research: 3, planning: 3, production: 5, distribution: 4, measurement: 4, optimization: 5}
  content_social: {research: 4, planning: 4, production: 5, distribution: 5, measurement: 3, optimization: 3}
  search_seo: {research: 5, planning: 4, production: 4, distribution: 3, measurement: 4, optimization: 4}
  data_crm: {research: 3, planning: 3, production: 3, distribution: 4, measurement: 5, optimization: 5}
  performance_ads: {research: 3, planning: 3, production: 4, distribution: 4, measurement: 5, optimization: 5}
  b2b_saas: {research: 4, planning: 4, production: 4, distribution: 3, measurement: 4, optimization: 4}
  ai_tech: {research: 4, planning: 4, production: 4, distribution: 3, measurement: 4, optimization: 4}
  brand: {research: 4, planning: 5, production: 4, distribution: 3, measurement: 3, optimization: 3}
  education: {research: 4, planning: 5, production: 5, distribution: 3, measurement: 3, optimization: 3}
  cx_service: {research: 3, planning: 3, production: 3, distribution: 4, measurement: 4, optimization: 5}
  general_marketing: {research: 4, planning: 4, production: 4, distribution: 4, measurement: 4, optimization: 4}

maturity_levels:
  L0: {label: 수동, desc: "사람이 모든 단계를 직접 수행해요"}
  L1: {label: AI 보조, desc: "개별 작업에 생성형 AI를 도구로 써요"}
  L2: {label: 워크플로 자동화, desc: "정해진 순서를 자동화하고 사람이 검수해요"}
  L3: {label: 에이전트, desc: "에이전트가 계획·실행하고 사람은 승인 지점만 맡아요"}
  L4: {label: 자율 운영, desc: "목표·가드레일 안에서 스스로 실험·최적화해요"}

