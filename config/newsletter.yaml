# B2B 뉴스레터 — 오픈율·완독율(CTOR) 최적화 구조
# 참조: Stripo B2B 2026, ClickMinded, Morning Brew, Lenny's Newsletter, Dyspatch modular
version: "1.0.0"

benchmarks:
  open_rate_b2b: "18-25% (MPP 보정 시 방향성 지표)"
  ctor_target: "10-15%"
  subject_max_chars: 50
  preheader_max_chars: 40
  read_time_minutes: [4, 6]
  sources:
    - "https://research.stripo.email/b2b-email-open-rate-benchmarks-2026"
    - "https://www.clickminded.com/newsletter-statistics/"
    - "https://growthmodels.co/morning-brew-marketing/"
    - "https://resources.averi.ai/examples/newsletter-examples"

patterns:
  # Morning Brew: TLDR → Hero → Modular roundups → tapering length → single CTA
  # Stripo 2026: CTOR > open rate, mobile first-line <30 chars
  # Lenny: one big idea + scannable modules + reader value first
  modules:
    - id: meta
      label: "발송 메타"
      required: [subject_lines, preheader, send_window]
    - id: tldr
      label: "30초 TLDR"
      bullets: 3
      role: "스킵 독자도 가치 — 완독율 기반"
    - id: hero
      label: "오늘의 1가지"
      words: [60, 120]
      role: "Inverted pyramid peak"
    - id: insight_modules
      label: "3분 읽기"
      count: 3
      format: "볼드 헤드라인 첫 줄 + 맥락 + 현장 적용 + 출처"
    - id: grab_bag
      label: "한 줄 데이터"
      role: "Morning Brew Grab Bag — 리듬 변화"
    - id: single_cta
      label: "이번 주 실습 1가지"
      links_max: 1
      role: "CTOR 집중 — 링크 분산 금지"
    - id: next_teaser
      label: "다음 호 예고"
      role: "호기심 루프 · 습관 형성"

voice:
  sender_name: "Hermes Studio"
  tone: "21년차 B2B 마케터 · 해요체 · 밀도 높음"
  mobile_first_line_max: 30

subject_templates:
  - "{topic} — 지금 손댈 곳은?"
  - "AX 실무, 3분이면 돼요"
  - "[{stamp}] B2B AI 주간 신호"

subject_patterns:
  - id: question
    template: "{topic} — 지금 손댈 곳은?"
  - id: number
    template: "{topic}, 3분이면 돼요"
  - id: contrast
    template: "{topic} — PoC가 아니라 FAQ"
  - id: noun
    template: "{topic} 체크리스트"

freshness:
  lookback_issues: 7
  max_topic_reuse: 0
  max_subject_pattern_streak: 1
  ledger_path: content/newsletter/issue-ledger.jsonl

safety:
  block_url_substrings:
    - undress
    - undresser
    - nsfw
    - deepnude
  block_title_substrings:
    - Undress
    - NSFW

title_integrity:
  prefer_source_when_korean_mismatch: true
  stale_korean_titles:
    - "한국 AX 전환 — 교육·FAQ·사례 중심"
    - "ChatGPT Workspace Agents 실무 검토"
    - "Claude 엔터프라이즈 — 거버넌스·컨텍스트"
    - "2026 AI·마케팅 실무 인사이트"
    - "2026 마케팅 실무 인사이트"
    - "2026 AI 마케팅 실무 인사이트"

boilerplate_ban:
  - "SEO·AEO·GEO 인용"
  - "맥롽"
  - "블로그·Notion 통합 컨텍스트에서 전문"
  - "통합 컨텍스트에서 전문 확인"
  - "블로그 Direct Answer + SEO/AEO/GEO 통합"
  - "에 대해 정리해요"
  - "에 대해 정리합니다"
  - "번째 인사이트"
  - "통합 컨텍스트 → 채널 재가공"
  - "Direct Answer·AEO"
  - "실무 실무"
  - "2026 AI·마케팅 실무 인사이트"
  - "2026 마케팅 실무 인사이트"
  - "2026 AI 마케팅 실무 인사이트"
  - "브랜드·퍼포먼스·콘텐츠·AX 관점에서 재해석"
  - "글로벌·국내 AI·마케팅 교차 신호"
  - "글로벌·대한민국 AI·마케팅 교차 신호"

scoring:
  min_winner_score: 40
  ideal_subject_chars: [28, 45]

# 성과 학습 — 평가용 시드는 실측으로 취급하지 않음 (R24-R27)
learning:
  min_real_records: 3
  seed_markers:
    - "p4-eval-seed"
    - "seed:true"
    - "eval-seed"
    - "gate-d-eval"
  targets:
    ctor_min_pct: 10.0
    ctr_min_pct: 2.0
    ctr_max_pct: 3.0
    reply_min_pct: 1.0
    unsub_max_pct: 0.5
  weights:
    strong: 8
    good: 4
    weak: -6
  pattern:
    min_records_per_pattern: 2

send_window:
  days: [tue, wed]
  time_kst: "10:00-11:00"

outputs:
  channel: content/newsletter
  package: content/packages/{date}_newsletter-context.md
  filename: "{date}_newsletter_{slug}.md"
  html: "{date}_newsletter_{slug}.html"
  subject_scores: "{date}_newsletter_subject-scores.json"

delivery:
  mode: notion_paste
  paste_pack: "content/packages/{date}_newsletter-paste.md"
  workflow: "Notion 코드 블록 복사 → 외부 뉴스레터 플랫폼 문서 편집기 붙여넣기"
  esp_send: false
  public_blog_base: ""

length_targets:
  email_words: [600, 1200]
  linkedin_words: [800, 1500]

esp:
  provider: resend
  from: "Hermes Studio <onboarding@resend.dev>"
  test_recipient: ""
  live_requires:
    - HERMES_ESP_APPROVED=1
    - RESEND_API_KEY
  hitl_command: "hermes-agent.sh approve esp --date {date}"
  dry_run_script: scripts/newsletter-send.sh
