# Research Brief — 페르소나·커버리지·검색 렌즈
version: "2.0.0"

persona:
  title: "21년차 디지털 마케팅·AX 컨설턴트"
  experience_years: 21
  domains:
    - 브랜드
    - 콘텐츠
    - 퍼포먼스
    - 그로스
    - 마케팅 전략
  ai_expertise:
    - AI 응용
    - AI 리터러시
    - AI 거버넌스
    - 책임있는 AI
  ai_expertise_years: "4~5"
  focus:
    - AI Agent 동향
    - Agentic AI
    - 엔터프라이즈 적용·성장 전략
  voice: |
    21년차 현장형 디지털 마케터이자, 최근 4~5년 AI Agent·Agentic AI 동향·성장 전략가.
    글로벌·국내 AI Agent 뉴스, 기술 트렌드, 산업 적용, 보안·거버넌스를
    기업 도입·성장 맥락에 맞게 해석합니다.

coverage:
  daily_lens:
    - 글로벌 뉴스·데이터
    - 대한민국 뉴스·데이터
  pillars:
    - id: agent_news
      label: "AI Agent 최신 뉴스·제품"
      keywords: [AI agent, agentic AI, multi-agent, autonomous agent]
    - id: agent_tech
      label: "AI Agent 기술 트렌드"
      keywords: [tool use, agent runtime, agent budget, MCP, orchestration]
    - id: agent_industry
      label: "산업·엔터프라이즈 적용"
      keywords: [enterprise agent, workflow automation, adoption, use case]
    - id: agent_security_gov
      label: "보안·통제·거버넌스"
      keywords: [AI governance, EU AI Act, agent security, human-in-the-loop, stop button]

insight_pipeline:
  - 리서치
  - 내용 요약
  - Insight 도출
  - 활용 방법
  - 가이드·팁

search_queries:
  - "AI agent news {year}"
  - "agentic AI enterprise adoption {year}"
  - "multi-agent workflow orchestration {year}"
  - "AI agent security governance {year}"
  - "EU AI Act AI agent compliance {year}"
  - "AI agent budget payment protocol {year}"
  - "Korea enterprise AI agent adoption {year}"
  - "OpenAI agents update {year}"
  - "Anthropic Claude agent computer use {year}"
  - "Salesforce agentic enterprise {year}"

freshness:
  min_search_results: 7
  search_timelimit: w          # d=day w=week — ddgs 최신 우선
  brief_required_for_m2: true
  auto_refresh_on_content: true # run-content-package 시 당일 brief 재수집

insight_limit: 7

# Keyword research / staging (M1 redesign)
keyword_research:
  require_approve_on_replace: true
  title_overlap_threshold: 0.55
  merge_default: true

schedule:
  mode: daily
  cron: "0 8 * * *"   # 매일 08:00 Asia/Seoul
  period: single_day    # period_start = period_end = today

priority_queries:
  korea: "Korea enterprise AI agent adoption {year}"
  llm:
    - "AI agent news {year}"
    - "agentic AI security governance {year}"
    - "multi-agent workflow enterprise {year}"
    - "AI agent industry use case {year}"
