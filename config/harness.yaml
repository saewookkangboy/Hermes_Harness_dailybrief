# Hermes Content Studio — Harness Engineering 설정
# 참조: https://github.com/walkinglabs/awesome-harness-engineering
# CAR: Control–Agency–Runtime (HarnessCard)

harness:
  version: "1.3.0"
  reference: awesome-harness-engineering
  card:
    control:
      - repo_local_instructions  # AGENTS.md, HARNESS.md
      - feature_list_scope       # .harness/feature_list.json
      - quality_gates            # validate-output.sh
      - sensitive_path_deny      # deny_paths
      - stable_section_guard     # SKILL.md STABLE 사람 전용
    agency:
      - deterministic_pipeline   # assemble-*.py (LLM 불필요)
      - tool_masking             # hermes-cli only for content
      - context_backpressure     # pre-fetch search, filesystem memory
      - single_active_feature    # one pipeline stage at a time
      - graph_context            # /ask 서브그래프 digest
    runtime:
      - init_bootstrap           # init.sh
      - observability            # traces, cost ledger, timing
      - session_handoff          # progress.md, session-handoff.md
      - health_gates             # health-check.sh before run
      - cost_ledger              # token gate + cost-report
      - playbook_log             # LEARNED 승격·강등 이력

paths:
  harness_dir: .harness
  feature_list: .harness/feature_list.json
  progress: .harness/progress.md
  session_handoff: .harness/session-handoff.md
  traces: .harness/traces
  cost_ledger: .harness/cost-ledger.jsonl
  eval_results: .harness/eval-results.json

# 성능 고도화 (Apple Silicon M2)
performance:
  # 결정적 파이프라인 우선 — LLM polish는 HERMES_ENHANCE=1 일 때만
  deterministic_first: true
  parallel_search_workers: 4
  search_max_results: 3
  # 단계별 SLA (초) — 초과 시 warn
  sla_seconds:
    research: 30
    content: 10
    lecture_basic: 15
    lecture_claude_design: 300
    notion_archive: 120
    full_pipeline: 70
    linkedin_m3: 15
    newsletter: 10
    agent_intent: 5
    wiki_graph_incremental: 3
    wiki_graph_rebuild: 10
  # 컨텍스트 절약: 콘텐츠 생성 시 MCP·브라우저 제외
  tool_masking:
    content_skills: [content-orchestration, marketing-research, content-pipeline, channel-linkedin, content-studio-slides]
    default_toolsets: hermes-cli
  # Ollama 메모리 관리
  ollama:
    unload_after_pipeline: false
    max_concurrent_llm: 1

# 가드레일
guardrails:
  deny_paths:
    - ~/.hermes/.env
    - ~/.ssh
    - "**/.env"
    - "**/credentials*"
    - "**/*secret*"
  require_validation_before_done: true
  require_notion_sync_telegram: true

# 검증 (12-Factor AgentOps)
verification:
  pre_run:
    - scripts/health-check.sh
  post_stage:
    research: scripts/validate-output.sh research
    blog: scripts/validate-output.sh blog
    instagram: scripts/validate-output.sh instagram
    linkedin: scripts/validate-output.sh linkedin
    newsletter: scripts/validate-output.sh newsletter
    newsletter_context: scripts/validate-output.sh newsletter-context
    newsletter_html: scripts/validate-output.sh newsletter-html
    newsletter_subject_scores: scripts/validate-output.sh newsletter-subject-scores
    lecture: scripts/validate-output.sh lecture
  post_pipeline:
    - scripts/harness-eval.sh --record

# Eval 기준선 (harness-eval.sh)
eval:
  baseline_seconds:
    research: 20
    # assemble + validate only (HERMES_SKIP_RESEARCH=1). 리서치 중복 계측 제외.
    content: 3
    newsletter: 5
    full_pipeline: 45
  min_search_hits: 5
  regression_threshold_pct: 25

# 토큰 SLA (F1) — performance.sla_seconds 와 병행. 기존 sec 키는 유지.
sla:
  research:
    sec: 30
    baseline: 20
    tokens_in: 6000
    tokens_out: 2500
    deterministic: false
  content:
    sec: 10
    baseline: 3
    tokens_in: 0
    tokens_out: 0
    deterministic: true
  newsletter:
    sec: 10
    baseline: 8
    tokens_in: 0
    tokens_out: 0
    deterministic: true
  full_pipeline:
    sec: 60
    baseline: 45
    tokens_in: 0
    tokens_out: 0
    deterministic: true
  wiki_graph:
    sec: 3
    baseline: 2
    tokens_in: 0
    tokens_out: 0
    deterministic: true
  polish:
    sec: 300
    baseline: null
    tokens_in: 24000
    tokens_out: 6000
    deterministic: false
  claude_design:
    sec: 300
    baseline: null
    tokens_in: 40000
    tokens_out: 12000
    deterministic: false
  ask:
    sec: 20
    baseline: null
    tokens_in: 3000
    tokens_out: 1200
    deterministic: false

token_gate:
  mode: warn
  tolerance_pct: 15
  deterministic_strict: true

skills:
  loading:
    mode: progressive
    index: config/skill-index.yaml
    level1_token_cap: 400

# 학습 루프 (F4) — HERMES_PLAYBOOK=stable 로 롤백
playbook:
  mode: learned
  stable_writable_by: human
  learned:
    append_only: true
    tombstone_marker: "⚠DEPRECATED"
    deprecate_after_harmful: 3
    verify_after_days: 14
  local_path:
    include_learned: true
    learned_max_entries: 8
    include_deprecated: false
  cloud_path:
    include_learned: true
    learned_max_entries: 0
    include_deprecated: false
    cache_breakpoint_after: STABLE
  promotion_gate:
    require_harness_eval: true
    require_validate_output: true
    max_token_increase_pct: 15
    shadow_runs: 5
  reflect:
    schedule: weekly
    model: cloud
    max_tokens_in: 6000
    max_deltas_per_run: 6
