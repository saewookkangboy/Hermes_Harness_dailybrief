  <rect x="0" y="0" width="1200" height="6" fill="#111111"/>
  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#666666" letter-spacing="1">HOW IT WORKS · DETERMINISTIC · LLM OPTIONAL</text>

