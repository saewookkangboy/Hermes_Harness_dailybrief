    <text x="372" y="212" text-anchor="middle" font-size="18" fill="#9A9A9A">Blog·Thr·IG·LI</text>
    <path d="M474 172 L496 172" stroke="#111111" stroke-width="2"/><path d="M490 166 L499 172 L490 178" fill="none" stroke="#111111" stroke-width="2"/>

