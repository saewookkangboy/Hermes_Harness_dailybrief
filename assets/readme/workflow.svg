<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 460" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Two deterministic pipelines: Daily M1 to M5 and Topic Pack M1 to M6</title>
  <desc id="wf-desc">Daily: Research Brief, Packages, Newsletter Gate A-D, Quality validate, Notion Permalink in 16-29 seconds. Topic Pack: Research with 7 lenses, AX Blueprint, Resource Map, Future Ahead, Channel Pack, Archive and learn in 10-20 seconds. Both are triggered from Telegram, Slack or PlayMCP.</desc>
