    <path d="M968 352 L986 352" stroke="#111111" stroke-width="2"/><path d="M981 346 L990 352 L981 358" fill="none" stroke="#111111" stroke-width="2"/>

    <rect x="992" y="292" width="160" height="120" rx="8" fill="#111111"/>
    <text x="1072" y="326" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#FFE500">M6</text>
    <text x="1072" y="360" text-anchor="middle" font-size="22" font-weight="700" fill="#F7F7F7">Archive</text>
    <text x="1072" y="390" text-anchor="middle" font-size="18" fill="#9A9A9A">Notion·학습</text>
  </g>

  <text x="1152" y="446" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#888888">Commander: Telegram · Slack · PlayMCP — /pipeline · /topic</text>
