    <text x="600" y="212" text-anchor="middle" font-size="18" fill="#9A9A9A">Gate A–D</text>
    <path d="M702 172 L724 172" stroke="#111111" stroke-width="2"/><path d="M718 166 L727 172 L718 178" fill="none" stroke="#111111" stroke-width="2"/>

