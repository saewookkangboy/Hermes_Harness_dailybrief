    <text x="144" y="212" text-anchor="middle" font-size="18" fill="#9A9A9A">Brief SoT</text>
    <path d="M246 172 L268 172" stroke="#111111" stroke-width="2"/><path d="M262 166 L271 172 L262 178" fill="none" stroke="#111111" stroke-width="2"/>

