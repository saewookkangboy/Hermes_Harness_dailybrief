<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hermes Content Studio</title>
  <desc id="desc">Self-hosted deterministic content studio on Apple M2. Daily mode turns the Brief SoT into Blog, Threads, Instagram, LinkedIn and Newsletter in 16-29 seconds. Topic mode turns any keyword into a Topic Pack M1 to M6 in 10-20 seconds. Both pass validate gates and archive to Notion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#111111"/><stop offset="100%" stop-color="#1A1A1A"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="8" height="420" fill="#FFE500"/>

  <g id="title-block" transform="translate(56 56)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#FFE500" letter-spacing="2">HARNESS v1.3 · SYSTEM LOGIC v2.1 · APPLE M2</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="50" font-weight="700" fill="#F7F7F7">Hermes Content Studio</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
      <text x="0" y="116" font-size="24" fill="#D0D0D0">결정적 마케팅·교육 콘텐츠 스튜디오</text>
      <text x="0" y="152" font-size="20" fill="#9A9A9A">일일 Brief SoT 채널 + 임의 키워드 Topic Pack</text>
    </g>
    <g id="proof-chips" transform="translate(0 192)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F7F7F7" text-anchor="middle">
      <rect x="0" y="0" width="200" height="40" rx="6" fill="#222222" stroke="#3A3A3A"/><text x="100" y="26">pipeline 16–29s</text>
      <rect x="212" y="0" width="200" height="40" rx="6" fill="#222222" stroke="#3A3A3A"/><text x="312" y="26">Gate A–D PASS</text>
      <rect x="0" y="52" width="200" height="40" rx="6" fill="#222222" stroke="#3A3A3A"/><text x="100" y="78">topic 10–20s</text>
      <rect x="212" y="52" width="200" height="40" rx="6" fill="#222222" stroke="#3A3A3A"/><text x="312" y="78">topic gates 7/7</text>
    </g>
    <text x="0" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#777777">Telegram · Slack · PlayMCP  →  /pipeline · /topic</text>
  </g>

  <g id="project-proof" transform="translate(688 32)">
    <rect x="0" y="0" width="456" height="364" rx="12" fill="#0A0A0A" stroke="#2A2A2A"/>
    <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#888888" letter-spacing="1">TWO MODES · ONE GATE STACK</text>

    <g id="daily-lane">
      <text x="24" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFE500" letter-spacing="1">DAILY</text>
      <rect x="24" y="84" width="408" height="44" rx="6" fill="#FFE500"/>
      <text x="228" y="113" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" fill="#111111">{date}_brief.md</text>
      <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="600" fill="#F7F7F7" text-anchor="middle">
        <rect x="24" y="140" width="74" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="61" y="168">Blog</text>
        <rect x="107" y="140" width="74" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="144" y="168">Thr</text>
        <rect x="190" y="140" width="74" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="227" y="168">IG</text>
        <rect x="273" y="140" width="74" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="310" y="168">LI</text>
        <rect x="356" y="140" width="76" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="394" y="168">NL</text>
      </g>
    </g>

    <g id="topic-lane">
      <text x="24" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFE500" letter-spacing="1">TOPIC</text>
      <rect x="25" y="231" width="406" height="42" rx="6" fill="none" stroke="#FFE500" stroke-width="2"/>
      <text x="228" y="259" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="20" font-weight="700" fill="#FFE500">"숏폼 커머스" → Topic Pack</text>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#F7F7F7" text-anchor="middle">
        <rect x="24" y="286" width="62" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="55" y="314">M1</text>
        <rect x="93" y="286" width="62" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="124" y="314">M2</text>
        <rect x="162" y="286" width="62" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="193" y="314">M3</text>
        <rect x="231" y="286" width="62" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="262" y="314">M4</text>
        <rect x="300" y="286" width="62" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="331" y="314">M5</text>
        <rect x="369" y="286" width="63" height="44" rx="6" fill="#1C1C1C" stroke="#3A3A3A"/><text x="400" y="314">M6</text>
      </g>
    </g>

    <text x="228" y="355" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#B8B8B8">validate → Notion Permalink</text>
  </g>
</svg>
