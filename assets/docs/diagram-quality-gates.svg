    <text x="600" y="388" font-size="18" fill="#666666">기회 ≥4</text>

    <rect x="687" y="305" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="759.5" y="356" font-size="20" font-weight="700" fill="#111111">future</text>
    <text x="759.5" y="388" font-size="18" fill="#666666">신호 ≥2</text>

    <rect x="846.5" y="305" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="919" y="356" font-size="20" font-weight="700" fill="#111111">channel</text>
    <text x="919" y="388" font-size="18" fill="#666666">naturalness</text>

    <rect x="1006" y="305" width="145" height="118" rx="10" fill="#FFE500" stroke="#111111" stroke-width="2"/>
    <text x="1078.5" y="356" font-size="20" font-weight="700" fill="#111111">validate</text>
    <text x="1078.5" y="388" font-size="18" fill="#444444">산출물 5종</text>
  </g>
</svg>
