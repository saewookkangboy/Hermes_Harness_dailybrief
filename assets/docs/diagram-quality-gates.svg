<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 452" role="img" aria-labelledby="t d">
  <title id="t">Quality gates: Newsletter Gate A to D and Topic Pack seven gates</title>
  <desc id="d">Newsletter: Gate A freshness, Gate B email and CTA, Gate C validate publishable, Gate D CTOR learning. Topic Pack: relevance at least 8 items, coverage at least 4 of 7 lenses, diversity at least 2 source types and 5 domains, blueprint at least 4 opportunities, future at least 2 signals per prediction, channel naturalness, and validate-output for 5 artifact types.</desc>
  <rect width="1200" height="452" rx="16" fill="#F7F7F7"/>
  <rect x="0" y="0" width="1200" height="6" fill="#111111"/>
  <text x="48" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#777777" letter-spacing="1">QUALITY GATES · NEWSLETTER A–D · TOPIC PACK 7</text>

  <g id="newsletter-gates" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif">
    <text x="48" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#111111">NEWSLETTER · publishable=true</text>

    <rect x="48" y="108" width="252" height="130" rx="12" fill="#111111"/>
    <text x="72" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#FFE500">GATE A</text>
    <text x="72" y="186" font-size="26" font-weight="700" fill="#F7F7F7">Freshness</text>
    <text x="72" y="218" font-size="18" fill="#9A9A9A">제목 · NSFW</text>
    <path d="M304 173 L322 173" stroke="#111111" stroke-width="2"/><path d="M317 167 L326 173 L317 179" fill="none" stroke="#111111" stroke-width="2"/>

    <rect x="332" y="108" width="252" height="130" rx="12" fill="#111111"/>
    <text x="356" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#FFE500">GATE B</text>
    <text x="356" y="186" font-size="26" font-weight="700" fill="#F7F7F7">Email / LI</text>
    <text x="356" y="218" font-size="18" fill="#9A9A9A">CTA · 16:9 이미지</text>
    <path d="M588 173 L606 173" stroke="#111111" stroke-width="2"/><path d="M601 167 L610 173 L601 179" fill="none" stroke="#111111" stroke-width="2"/>

    <rect x="616" y="108" width="252" height="130" rx="12" fill="#FFE500"/>
    <text x="640" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#111111">GATE C</text>
    <text x="640" y="186" font-size="26" font-weight="700" fill="#111111">Validate</text>
    <text x="640" y="218" font-size="18" fill="#444444">publishable</text>
    <path d="M872 173 L890 173" stroke="#111111" stroke-width="2"/><path d="M885 167 L894 173 L885 179" fill="none" stroke="#111111" stroke-width="2"/>

    <rect x="900" y="108" width="252" height="130" rx="12" fill="#111111"/>
    <text x="924" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#FFE500">GATE D</text>
    <text x="924" y="186" font-size="26" font-weight="700" fill="#F7F7F7">CTOR</text>
    <text x="924" y="218" font-size="18" fill="#9A9A9A">10–15% 학습</text>
  </g>

  <g id="topic-gates" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif" text-anchor="middle">
    <text x="48" y="288" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#111111">TOPIC PACK · 7/7 PASS · blocking</text>

    <rect x="49" y="305" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="121.5" y="356" font-size="20" font-weight="700" fill="#111111">relevance</text>
    <text x="121.5" y="388" font-size="18" fill="#666666">근거 ≥8</text>

    <rect x="208.5" y="305" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="281" y="356" font-size="20" font-weight="700" fill="#111111">coverage</text>
    <text x="281" y="388" font-size="18" fill="#666666">렌즈 ≥4/7</text>

    <rect x="368" y="305" width="145" height="118" rx="10" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
    <text x="440.5" y="356" font-size="20" font-weight="700" fill="#111111">diversity</text>
