  <text x="48" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#FFE500" letter-spacing="1">CONTENT LOOPS · SCHEDULE + VERIFY + LOG</text>
  <rect x="48" y="80" width="340" height="120" rx="12" fill="#F7F7F7" stroke="#111111" stroke-width="2"/>
  <text x="72" y="120" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#FFE500">L1</text>
  <text x="72" y="152" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#111111">Report</text>
  <text x="72" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" fill="#888888">triage · health</text>
  <rect x="420" y="80" width="340" height="120" rx="12" fill="#111111" stroke="#111111" stroke-width="2"/>
