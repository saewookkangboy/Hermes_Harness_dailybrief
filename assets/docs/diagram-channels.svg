<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Channel outputs from two sources</title>
  <desc id="d">The daily Brief SoT and the keyword-driven Topic Pack both feed five channel formats: Velog blog, Threads, Instagram carousel, LinkedIn feed and Newsletter with Gate A-D.</desc>
  <rect width="1200" height="340" rx="16" fill="#111111"/>
  <rect x="0" y="0" width="8" height="340" fill="#FFE500"/>
  <text x="48" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#FFE500" letter-spacing="1">CHANNELS · TWO SOURCES · FIVE FORMATS</text>

  <g id="sources">
    <rect x="48" y="76" width="260" height="110" rx="10" fill="#FFE500"/>
    <text x="178" y="124" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#111111">Brief SoT</text>
    <text x="178" y="156" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#111111">{date}_brief.md</text>

    <rect x="49" y="205" width="258" height="108" rx="10" fill="#111111" stroke="#FFE500" stroke-width="2"/>
    <text x="178" y="252" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#FFE500">Topic Pack</text>
    <text x="178" y="284" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#B8B8B8">topics/{slug}/</text>
  </g>

  <g id="connectors" fill="none" stroke="#888888" stroke-width="2">
    <path d="M308 131 L346 131 L346 259 L308 259"/>
    <path d="M346 195 L374 195"/>
    <path d="M368 189 L377 195 L368 201"/>
  </g>

  <g id="channels">
    <rect x="384" y="100" width="768" height="190" rx="12" fill="none" stroke="#3A3A3A"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif" text-anchor="middle">
      <rect x="400" y="116" width="132" height="158" rx="10" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="466" y="186" font-size="24" font-weight="700" fill="#F7F7F7">Blog</text>
      <text x="466" y="218" font-size="18" fill="#9A9A9A">Velog</text>

      <rect x="551" y="116" width="132" height="158" rx="10" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="617" y="186" font-size="24" font-weight="700" fill="#F7F7F7">Threads</text>
      <text x="617" y="218" font-size="18" fill="#9A9A9A">블로그 링크</text>

      <rect x="702" y="116" width="132" height="158" rx="10" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="768" y="186" font-size="24" font-weight="700" fill="#F7F7F7">IG</text>
      <text x="768" y="218" font-size="18" fill="#9A9A9A">carousel</text>

      <rect x="853" y="116" width="132" height="158" rx="10" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="919" y="186" font-size="24" font-weight="700" fill="#F7F7F7">LinkedIn</text>
      <text x="919" y="218" font-size="18" fill="#9A9A9A">1300자</text>

      <rect x="1004" y="116" width="132" height="158" rx="10" fill="#1C1C1C" stroke="#3A3A3A"/>
      <text x="1070" y="186" font-size="24" font-weight="700" fill="#F7F7F7">NL</text>
      <text x="1070" y="218" font-size="18" fill="#9A9A9A">Gate A–D</text>
    </g>
  </g>

  <text x="1152" y="322" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="18" fill="#888888">voice · naturalness 게이트를 통과해야 저장돼요</text>
</svg>
